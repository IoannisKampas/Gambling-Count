# /etc/nginx/sites-available/bj-monitor  ->  symlink into sites-enabled
#
# Two things here are load-bearing, not boilerplate:
#
#   proxy_buffering off  - the wall is driven by Server-Sent Events on /events. With
#                          nginx's default buffering the browser receives nothing until
#                          the buffer fills, so the page loads and then sits there dead.
#   proxy_read_timeout   - an SSE connection is idle between results. The 60s default
#                          cuts it, and the page silently stops updating after a minute.
#
# The app has no login of its own, so the basic_auth below is the only thing between the
# internet and your session tokens. Create the password file with:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd yourname

server {
    listen 80;
    server_name monitor.example.com;   # <- your hostname

    # certbot rewrites this block to add TLS and a :443 server. Run:
    #   sudo certbot --nginx -d monitor.example.com

    auth_basic "monitor";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: stream through, never buffer, and let an idle stream stay open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }
}
